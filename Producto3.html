<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información del Producto</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <script src="JS/bootstrap.bundle.min.js"></script>
    <script src="JS/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#confirmar").on("click", function(){
                alert("Producto añadido al carrito");
            });
        });
    </script>
    <style>
        .imagen-principal {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            border: 5px solid #000;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Tienda</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Categorías</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Ofertas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <img src="Imagenes/PTnoiseoldhud.gif" class="imagen-principal" alt="Producto">
            </div>
            <div class="col-md-6">
                <h2>Nombre del Producto</h2>
                <p><strong>Precio:</strong> $20</p>
                <p>Este producto es ideal para...</p>
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" class="form-control w-25" min="1" value="1">
                <button class="btn btn-success mt-3" id="confirmar">Añadir al carrito</button>
            </div>
        </div>
    </div>
    
    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2025 Tienda en Línea. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
