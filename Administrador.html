<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <h4 class="text-center text-primary">Inventario</h4>
        <div class="submenu">
            <p class="admin-option" data-section="bajaProducto">Eliminar productos</p>
            <p class="admin-option" data-section="anadirProducto">Añadir productos</p>
            <p class="admin-option" data-section="actualizarProducto">Actualizar productos</p>
        </div>
        <h4 class="text-center text-primary">Adminsitracion</h4>
        <div class="submenu">
            <p class="admin-option" data-section="estadisticas">Estadísticas de ventas</p>
            <p class="admin-option" data-section="solicitudEncargo">Solicitar encargo</p>
            <p class="admin-option" data-section="encargosPendientes">Encargos Pendientes</p>
            <p class="admin-option" data-section="historialAdministrativo">Historial Administrativo</p>
        </div>
        <h4 class="text-center text-primary">Pedidos</h4>
        <div class="submenu">
            <p class="admin-option" data-section="historialPedidos">Historial de pedidos</p>
        </div>
    </div>

    <div class="toggle-tab" id="toggleSidebar">&#x25C0;</div>

    <div class="content">
        <div class="content-area" id="mainContent">
            <h3 class="text-center">Bienvenido al Panel de Administración</h3>
            <p class="text-center">Selecciona una opción del menú para comenzar.</p>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            // Toggle sidebar visibility with animation
            let sidebarVisible = true;
            $("#toggleSidebar").click(function () {
                $("#sidebar").toggleClass("hidden");
                sidebarVisible = !sidebarVisible;
                $(this).html(sidebarVisible ? "&#x25C0;" : "&#x25B6;");
            });

            // Cargar el contenido de la sección seleccionada
            $(".admin-option").click(function () {
                const section = $(this).data("section");

                // Limpiar el contenido anterior con una animación suave
                $("#mainContent").fadeOut(300, function () {
                    $(this).html('<h3>Cargando...</h3>');
                    $.getScript(`js/${section}.js`, function () {
                        // El script se cargó y ejecutó correctamente, mostrar el contenido
                        $("#mainContent").fadeIn(500);
                    });
                });
            });
        });
    </script>
</body>
</html>
