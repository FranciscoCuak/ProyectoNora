<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        canvas {
            width: 220px !important;
            height: 220px !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Distribución de Ventas</h3>
        <canvas id="graficoPastel"></canvas>
    </div>

    <script>
        const datosVentas = {
            labels: ['Electrónica', 'Ropa', 'Comida'],
            datasets: [{
                data: [900, 150, 200],
                backgroundColor: ['#ff6384', '#36a2eb', '#ffce56'],
                borderColor: ['#d32f2f', '#1976d2', '#ff8f00'],
                borderWidth: 2
            }]
        };

        new Chart(document.getElementById('graficoPastel'), {
            type: 'pie',
            data: datosVentas,
            options: {
                responsive: false,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'right' } }
            }
        });
    </script>

</body>
</html>
