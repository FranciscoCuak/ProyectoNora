<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel del Vendedor</title>
  <link rel="stylesheet" href="CSS/bootstrap.min.css"/>
  <script src="JS/jquery-3.7.1.min.js"></script>
  <style>
    body {
      background-color: #0e0e1a;
      color: #e0e0f0;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    #sidebar {
      width: 250px;
      min-height: 100vh;
      background-color: rgba(30, 30, 47, 0.9);
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease;
      z-index: 1000;
      border-right: 1px solid rgba(127, 199, 255, 0.1);
    }

    #sidebar.hidden {
      transform: translateX(-100%);
    }

    .nav-link {
      color: #e0e0f0;
      padding-left: 1.5rem;
      transition: background-color 0.2s;
    }

    .nav-link:hover {
      background-color: rgba(60, 60, 90, 0.5);
    }

    .nav-section-title {
      color: #7fc7ff;
      font-weight: bold;
      margin-top: 1rem;
      padding-left: 1rem;
    }

    .btn-nebhula {
      background-color: #7fc7ff;
      border: none;
      color: #000;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .btn-nebhula:hover {
      background-color: #5fb0e0;
      box-shadow: 0 0 8px rgba(127, 199, 255, 0.4);
    }

    #main-content {
      margin-left: 250px;
      transition: margin-left 0.3s ease, padding 0.3s;
      padding: 2rem;
    }

    #main-content.expanded {
      margin-left: 0;
    }

    #toggleSidebar {
      position: fixed;
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
      background-color: #7fc7ff;
      border: none;
      color: black;
      font-weight: bold;
      border-radius: 0 6px 6px 0;
      padding: 8px 10px;
      z-index: 1100;
      box-shadow: 0 0 8px rgba(127, 199, 255, 0.3);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    #toggleSidebar:hover {
      background-color: #5fb0e0;
      box-shadow: 0 0 12px rgba(127, 199, 255, 0.5);
    }

    .glass-panel {
      background-color: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(6px);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(127, 199, 255, 0.2);
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2, h3 {
      color: #7fc7ff;
    }

    @media (max-width: 768px) {
      #main-content {
        margin-left: 0 !important;
        padding: 1rem;
      }

      #sidebar {
        width: 200px;
      }
    }
  </style>
</head>
<body>

  <!-- Botón tipo pestaña -->
  <button id="toggleSidebar">☰</button>

  <!-- Sidebar -->
  <nav id="sidebar" class="p-3">
    <h4 class="text-light">Vendedor</h4>

    <div class="nav-section-title">Ventas</div>
    <ul class="nav flex-column">
      <li class="nav-item"><a href="#" class="nav-link" data-section="ventas-recientes">Ventas Recientes</a></li>
      <li class="nav-item"><a href="#" class="nav-link" data-section="mas-vendidos">Más Vendidos</a></li>
      <li class="nav-item"><a href="#" class="nav-link" data-section="anadir-ofertas">Añadir Ofertas</a></li>
      <li class="nav-item"><a href="#" class="nav-link" data-section="ofertas">Ofertas</a></li>
    </ul>

    <div class="nav-section-title">Inventario</div>
    <ul class="nav flex-column">
      <li class="nav-item"><a href="#" class="nav-link" data-section="disponibilidad">Disponibilidad de Inventario</a></li>
      <li class="nav-item"><a href="#" class="nav-link" data-section="reporte-inventario">Reporte de Inventario</a></li>
    </ul>
  </nav>

  <!-- Contenido principal -->
  <main class="p-4" id="main-content">
    <h2 class="text-primary">Panel del Vendedor</h2>
    <div id="contenido-dinamico" class="mt-4 glass-panel">
      Selecciona una función del menú
    </div>
  </main>

  <script>
    $(document).ready(function () {
      $(".nav-link").click(function (e) {
        e.preventDefault();
        const section = $(this).data("section");
        let html = "";

        switch (section) {
          case "ventas-recientes":
            html = `<h3>Ventas Recientes</h3><p>Aquí se mostrarán las ventas más recientes.</p>`;
            break;
          case "mas-vendidos":
            html = `<h3>Productos Más Vendidos</h3><p>Listado de los productos con más ventas.</p>`;
            break;
          case "anadir-ofertas":
            html = `<h3>Añadir Ofertas</h3><button class="btn btn-nebhula">Nueva Oferta</button>`;
            break;
          case "ofertas":
            html = `<h3>Ofertas Actuales</h3><p>Listado de promociones vigentes.</p>`;
            break;
          case "disponibilidad":
            html = `<h3>Disponibilidad de Inventario</h3><p>Listado de productos y sus cantidades.</p>`;
            break;
          case "reporte-inventario":
            html = `<h3>Reporte de Inventario</h3><button class="btn btn-nebhula">Generar Reporte</button>`;
            break;
          default:
            html = `<p>Sección no encontrada.</p>`;
        }

        $("#contenido-dinamico").hide().html(html).fadeIn(300);
      });

      $("#toggleSidebar").click(function () {
        $("#sidebar").toggleClass("hidden");
        $("#main-content").toggleClass("expanded");
      });
    });
  </script>

</body>
</html>
