<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <script src="JS/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#Registro").on("submit", function(e){
                e.preventDefault();
                let validado = true;
                
                let nombre = $("#nombre").val();
                if (nombre.length < 3) {
                    $("#nombre").addClass("is-invalid");
                    validado = false;
                } else {
                    $("#nombre").removeClass("is-invalid").addClass("is-valid");
                }

                let correo = $("#correo").val();
                let correoRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!correoRegex.test(correo)) {
                    $("#correo").addClass("is-invalid");
                    validado = false;
                } else {
                    $("#correo").removeClass("is-invalid").addClass("is-valid");
                }

                let password = $("#password").val();
                if (password.length < 6) {
                    $("#password").addClass("is-invalid");
                    validado = false;
                } else {
                    $("#password").removeClass("is-invalid").addClass("is-valid");
                }

                if (!$("#terminos").prop("checked")) {
                    alert("Debes aceptar los términos y condiciones");
                    validado = false;
                }

                if (validado) {
                    $.post("registroUsuarios.php",{nombre_p:nombre,correo_p:correo,password_p:password}, function(data){
                        $("#mensaje").removeClass("d-none").addClass("alert-success").text(data)
                        $("#registro")[0].reset(); //resetea el formulario
                        $(".is-valid").removeClass("is-valid");//todos lo que tengan la clase is-valid se remueve la clase
                    }).fail(function(){
                        $("#mensaje").removeClass("d-none").addClass("alert-danger").text("Error de comunicacion con el servidor")
                    })
                }
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-8">
                <h2 class="text-center text-primary">FORMULARIO DE REGISTRO</h2>
                <div id="mensaje" class="alert d-none"></div>
                <h5 class="text-center txt-info">Bienvenido nuevo cliente a la experiencia SAC</h5>
                <form action="#" id="Registro" class="bg-white p-5 shadow rounded">   
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre">
                        <div class="invalid-feedback">El nombre debe tener al menos 3 caracteres</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" name="correo">
                        <div class="invalid-feedback">El correo electrónico no es válido</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password">
                        <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres</div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terminos">
                        <label for="terminos" class="form-check-label">Acepto los términos y condiciones</label>
                    </div>
                    
                    <div class="mb-3 text-center">
                        <button class="btn btn-primary" type="submit">Enviar</button>
                        <a href="Login.html" class="btn btn-success">Acceder con cuenta existente</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
