<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>Sales Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Inter', sans-serif;
    }
    .sidebar {
      width: 80px;
      background: white;
      border-right: 1px solid #d1d5db;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 1.5rem;
      padding-bottom: 1.5rem;
    }
    .sidebar nav a {
      font-size: 0.75rem;
      font-weight: 600;
      color: #4b5563;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .sidebar nav a.active,
    .sidebar nav a:hover {
      color: #2563eb;
    }
    .sidebar nav a i {
      font-size: 1.125rem;
    }
    .sidebar-bottom a {
      font-size: 0.75rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
    }
    .sidebar-bottom a:last-child i {
      background-color: black;
      color: white;
      border-radius: 50%;
      padding: 2px;
      font-size: 1.125rem;
    }
    .card-border {
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      background: white;
      padding: 1rem;
    }
    .table thead th {
      font-weight: 600;
      font-size: 0.75rem;
      border-bottom: 1px solid #d1d5db;
      background-color: #f3f4f6;
      color: #374151;
    }
    .table tbody td {
      font-size: 0.75rem;
      border-top: 1px solid #d1d5db;
      vertical-align: middle;
    }
    .table tbody tr:nth-child(even) {
      background-color: #f9fafb;
    }
    .progress {
      height: 1.25rem;
      background-color: #e5e7eb;
      border-radius: 0.375rem;
    }
    .progress-bar {
      background-color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <aside class="sidebar d-flex flex-column justify-content-between">
      <div class="d-flex flex-column align-items-center">
        <div class="mb-4">
          <img
            src="https://storage.googleapis.com/a1aa/image/e08d0e41-651f-441d-b6d5-8f48f7aec2ea.jpg"
            alt="Company logo, black circle with a diagonal line and text Company"
            width="40"
            height="40"
          />
        </div>
        <nav class="d-flex flex-column align-items-center">
          <a href="#" class="active" title="Dashboard">
            <i class="fas fa-th-large"></i>
            <span class="mt-1">Dashboard</span>
          </a>
          <a href="#" title="Orders">
            <i class="fas fa-box-open"></i>
            <span class="mt-1">Orders</span>
          </a>
          <a href="#" title="Inventory">
            <i class="fas fa-warehouse"></i>
            <span class="mt-1">Inventory</span>
          </a>
          <a href="#" title="Reports">
            <i class="fas fa-chart-bar"></i>
            <span class="mt-1">Reports</span>
          </a>
          <a href="#" title="Employees">
            <i class="fas fa-user-friends"></i>
            <span class="mt-1">Employees</span>
          </a>
          <a href="#" title="Customers">
            <i class="fas fa-users"></i>
            <span class="mt-1">Customers</span>
          </a>
        </nav>
      </div>
      <div class="sidebar-bottom d-flex flex-column align-items-center">
        <a href="#" title="Settings"><i class="fas fa-cog"></i></a>
        <a href="#" title="Profile"><i class="fas fa-user-circle"></i></a>
        <a href="#" title="Search"><i class="fas fa-search"></i></a>
        <a href="#" title="Help"><i class="fas fa-question-circle"></i></a>
        <a href="#" title="Profile"><i class="fas fa-user-circle"></i></a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h5 fw-semibold mb-0">Sales Dashboard</h1>
        <button class="btn btn-link text-black p-0" aria-label="Notifications" type="button">
          <i class="fas fa-bell"></i>
        </button>
      </div>

      <!-- Top dashboard cards -->
      <div class="row g-3 mb-4">
        <!-- Sales by Rep -->
        <section class="col-12 col-md-6 card-border">
          <h2 class="text-black fw-semibold small mb-2">Sales by Rep</h2>
          <img
            src="https://storage.googleapis.com/a1aa/image/f58b6d69-65f9-428e-ee93-b3a37b77e906.jpg"
            alt="Bar chart showing sales by representative with vertical bars and icons below each bar"
            class="img-fluid"
            style="max-height: 120px; width: 100%; object-fit: contain"
          />
        </section>

        <!-- Funnel Chart -->
        <section class="col-12 col-md-6 col-lg-5 card-border d-flex flex-column justify-content-between">
          <h2 class="text-black fw-semibold small mb-2">Funnel Chart</h2>
          <img
            src="https://storage.googleapis.com/a1aa/image/3dd1e58b-295f-427a-8e5a-442a5228951c.jpg"
            alt="Funnel chart with bars labeled Qualified, Proposal, Negotiation, Contract, New and a 27% conversion rate text on the right"
            class="img-fluid"
            style="max-height: 120px; width: 100%; object-fit: contain"
          />
          <div class="d-flex justify-content-end align-items-center mt-2 small fw-semibold text-black">
            <span>27%</span>
            <span class="ms-1 fw-normal">Conversion</span>
          </div>
        </section>

        <!-- Average Value of Won Deals -->
        <section class="col-12 col-md-3 col-lg-2 card-border d-flex flex-column justify-content-center">
          <h2 class="text-black fw-semibold small mb-2">Average Value of Won Deals</h2>
          <p class="fs-4 fw-bold mb-0">$128,100</p>
        </section>

        <!-- Sales Pipeline -->
        <section class="col-12 col-md-3 col-lg-2 card-border d-flex flex-column justify-content-center">
          <h2 class="text-black fw-semibold small mb-2">Sales Pipeline</h2>
          <div class="d-flex align-items-center gap-3">
            <img
              src="https://storage.googleapis.com/a1aa/image/45ff8f32-284f-4e96-d461-11d5bfdfd5a0.jpg"
              alt="Pie chart showing sales pipeline with segments for Won, Contract, Proposal, New"
              width="80"
              height="80"
              style="object-fit: contain"
            />
            <ul class="list-unstyled small mb-0">
              <li class="d-flex align-items-center mb-1">
                <span class="d-inline-block rounded-circle bg-black me-2" style="width: 12px; height: 12px;"></span>Won
              </li>
              <li class="d-flex align-items-center mb-1">
                <span class="d-inline-block rounded-circle bg-secondary me-2" style="width: 12px; height: 12px; opacity: 0.7;"></span>Contract
              </li>
              <li class="d-flex align-items-center mb-1">
                <span class="d-inline-block rounded-circle bg-secondary me-2" style="width: 12px; height: 12px; opacity: 0.4;"></span>Proposal
              </li>
              <li class="d-flex align-items-center">
                <span class="d-inline-block rounded-circle bg-secondary me-2" style="width: 12px; height: 12px; opacity: 0.2;"></span>New
              </li>
            </ul>
          </div>
        </section>

        <!-- Monthly Goal -->
        <section class="col-12 col-md-3 col-lg-1 card-border d-flex flex-column justify-content-center">
          <h2 class="text-black fw-semibold small mb-2">Monthly Goal</h2>
          <p class="fs-5 fw-bold mb-1">$6.2M</p>
          <p class="small text-secondary mb-2">Goal $8.1M</p>
          <div class="progress" role="progressbar" aria-valuenow="76.5" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar" style="width: 76.5%"></div>
          </div>
        </section>
      </div>

      <hr class="mb-4" />
    </section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
