<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container py-4 bg-light">
    <h3>Historial de Compras</h3>
    <div id="contenedorHistorial" class="mt-3">
      
    </div>
  
    <script>
      const historial = [
        {
          ordenId: 1745978972573,
          fecha: "2025-04-29T19:09:32",
          productos: [
            { nombre: "Lanzas de tamarindo", cantidad: 1, precio: 17.00 }
          ]
        },
        {
          ordenId: 1745978972574,
          fecha: "2025-04-28T15:30:00",
          productos: [
            { nombre: "Gomitas de gusano", cantidad: 2, precio: 15.00 },
            { nombre: "Manguitos de chile", cantidad: 1, precio: 18.00 }
          ]
        }
      ];
  
      function formatearFecha(fechaISO) {
        const opciones = { day: 'numeric', month: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' };
        return new Date(fechaISO).toLocaleString('es-MX', opciones);
      }
  
      function renderHistorial() {
        const contenedor = $("#contenedorHistorial");
        contenedor.empty();
  
        historial.forEach(orden => {
          const productosHtml = orden.productos.map(p =>
            `<div>${p.nombre} x${p.cantidad} - $${(p.precio * p.cantidad).toFixed(2)}</div>`
          ).join("");
  
          const total = orden.productos.reduce((acc, p) => acc + (p.precio * p.cantidad), 0);
          const fechaFormateada = formatearFecha(orden.fecha);
  
          contenedor.append(`
            <div class="card mb-3">
              <div class="card-body">
                <strong>Orden #${orden.ordenId} - ${fechaFormateada}</strong>
                <div class="mt-2">
                  ${productosHtml}
                </div>
                <div class="mt-2 fw-bold">Total: $${total.toFixed(2)}</div>
              </div>
            </div>
          `);
        });
      }
  
      renderHistorial();
    </script>
  </body>
  </html>
