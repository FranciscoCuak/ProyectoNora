<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar productos</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <script src="JS/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Actualizar Productos</h1>
        <form id="buscarProductoForm" class="mb-3">
            <div class="mb-3">
                <label for="idProducto" class="form-label">ID del Producto:</label>
                <input type="text" class="form-control" id="idProducto" name="idProducto" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="buscarProducto()">Buscar</button>
        </form>

        <div id="productoEncontrado" style="display: none;">
            <h2>Producto Encontrado</h2>
            <form id="actualizarProductoForm">
                <input type="hidden" id="idProductoActualizar" name="idProductoActualizar">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción:</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio:</label>
                    <input type="number" class="form-control" id="precio" name="precio" required>
                </div>

                <div class="mb-3">
                    <label for="stock" class="form-label">Stock:</label>
                    <input type="number" class="form-control" id="stock" name="stock" required>
                </div>

                <button type="button" class="btn btn-success" onclick="actualizarProducto()">Actualizar</button>
            </form>
        </div>
    </div>
    <div>
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
</body>
</html>
