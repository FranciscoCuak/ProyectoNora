<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda en Línea</title>
  <link rel="stylesheet" href="CSS/bootstrap.min.css">
  <script src="JS/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      background-size: cover;
      background-position: center;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      background-color: rgba(0, 0, 0, 0.6) !important;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }

    .navbar-brand,
    .nav-link,
    .dropdown-toggle {
      color: #00bcd4 !important;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.6);
      border: none;
      color: #ffffff;
      transition: transform 0.3s ease;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 188, 212, 0.2);
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(0, 188, 212, 0.4);
    }

    .card img {
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .btn-primary {
      background-color: #00bcd4;
      border-color: #00bcd4;
    }

    .btn-primary:hover {
      background-color: #0097a7;
      border-color: #0097a7;
    }

    .dropdown-menu {
      background-color: rgba(0, 0, 0, 0.8);
      border: none;
    }

    .dropdown-menu .btn {
      color: #00bcd4;
      width: 100%;
    }

    .dropdown-menu .btn:hover {
      background-color: rgba(0, 188, 212, 0.2);
    }

    /* Modal */
    .modal-content {
      background-color: rgba(0, 0, 0, 0.85);
      color: white;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 188, 212, 0.3);
    }

    .modal-header {
      border-bottom: 1px solid #00bcd4;
    }

    .modal-title {
      color: #00bcd4;
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid #00bcd4;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: #0097a7;
      box-shadow: 0 0 5px rgba(0, 188, 212, 0.5);
    }
  </style>
</head>
<body>

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Tienda</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Categorías</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Ofertas</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
      </ul>
      <div class="dropdown ms-3">
        <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
          Opciones
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <button class="btn" type="button" data-bs-toggle="modal" data-bs-target="#Ejemplomodal">
              Iniciar Sesión
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- Modal de inicio de sesión -->
<div id="Ejemplomodal" class="modal fade" tabindex="-1" aria-labelledby="ejemplomodallabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ejemplomodallabel">.: LOGIN :.</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form action="#" method="post">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario:</label>
            <input type="text" class="form-control" name="usuario" id="usuario">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña:</label>
            <input type="password" class="form-control" name="password" id="password">
          </div>
        </form>
        <div class="mb-3 text-center">
          <img src="Imagenes/8lj7eb.webp" alt="Imagen login" class="img-fluid rounded">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-success">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Sección de productos -->
<div class="container mt-4">
  <div class="row">
    <!-- Producto 1 -->
    <div class="col-md-4 mb-4">
      <div class="card">
        <img src="Imagenes/noise-the-noise.gif" class="card-img-top" alt="Producto 1">
        <div class="card-body">
          <h5 class="card-title">Producto 1</h5>
          <p class="card-text">Descripción breve del producto.</p>
          <a href="Producto1.html" class="btn btn-primary">Ver más</a>
        </div>
      </div>
    </div>
    <!-- Producto 2 -->
    <div class="col-md-4 mb-4">
      <div class="card">
        <img src="Imagenes/8lj7eb.webp" class="card-img-top" alt="Producto 2">
        <div class="card-body">
          <h5 class="card-title">Producto 2</h5>
          <p class="card-text">Descripción breve del producto.</p>
          <a href="Producto2.html" class="btn btn-primary">Ver más</a>
        </div>
      </div>
    </div>
    <!-- Producto 3 -->
    <div class="col-md-4 mb-4">
      <div class="card">
        <img src="Imagenes/PTnoiseoldhud.gif" class="card-img-top" alt="Producto 3">
        <div class="card-body">
          <h5 class="card-title">Producto 3</h5>
          <p class="card-text">Descripción breve del producto.</p>
          <a href="Producto3.html" class="btn btn-primary">Ver más</a>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
